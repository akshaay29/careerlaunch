# Render Blueprint: ONE free web service for the api (spine: prod environment).
# Deploys are triggered only by the release workflow's deploy hook, AFTER migrations
# (.github/workflows/migrate-deploy.yml), never by pushes.
services:
  - type: web
    name: careerlaunch-api
    runtime: python
    plan: free
    region: singapore
    rootDir: api
    autoDeployTrigger: "off"
    buildCommand: pip install uv==0.13.1 && uv sync --frozen --no-dev
    startCommand: .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /api/v1/public/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.8"
      - key: ENVIRONMENT
        value: prod
      - key: LOG_LEVEL
        value: INFO
      # Secrets / per-deployment values: set in the Render dashboard (never committed).
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: CORS_EXTRA_ORIGINS
        value: http://localhost:3000
      # Drain secret for /internal/* (AD-4); same value as Vault `drain_secret` and the
      # DRAIN_SECRET GitHub secret. DRAIN_SECRET_PREVIOUS only while rotating.
      - key: DRAIN_SECRET
        sync: false
      - key: DRAIN_SECRET_PREVIOUS
        sync: false
      - key: DRAIN_TIMEOUT_SECONDS
        value: "240"
      - key: DRAIN_STALE_AFTER_MINUTES
        value: "15"
      # Supabase Auth (AD-5): token issuer / JWKS base, and the legacy HS256 secret (if the
      # project still signs with it).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      # Supabase Storage (FileStore): service-role key (secret, api only), the private bucket
      # and the Resume version cap.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STORAGE_BUCKET
        value: private
      - key: RESUME_MAX_VERSIONS
        value: "10"
      - key: DOCUMENT_MAX_COUNT
        value: "20"
      # Provider Key encryption (AD-6): master key(s), set in the dashboard; an offline copy
      # lives in the owner's password manager. Apify integration header value.
      - key: CREDENTIALS_MASTER_KEYS
        sync: false
      - key: APIFY_INTEGRATION_PLATFORM
        value: careerlaunch
      # Collection (Story 2.3): allowlisted actors (first one runs), cadence, per-run caps and
      # the platform kill switch.
      - key: APIFY_ACTOR_ALLOWLIST
        value: curious_coder/linkedin-jobs-scraper,harvestapi/linkedin-job-search
      - key: COLLECT_INTERVAL_HOURS
        value: "24"
      - key: COLLECT_LOCAL_HOUR
        value: "6"
      - key: COLLECT_MAX_ITEMS
        value: "100"
      - key: COLLECT_MAX_CHARGE_USD
        value: "0.25"
      - key: PROVIDER_RUNS_ENABLED
        value: "true"
      - key: DEFAULT_MONTHLY_CAP_USD
        value: "4.00"
      - key: APIFY_PRICE_PER_ITEM_USD
        value: "0.001"
      - key: PLATFORM_MONTHLY_CAP_USD
        sync: false
