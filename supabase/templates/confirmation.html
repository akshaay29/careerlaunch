<!-- CareerLaunch sign-up confirmation (Story 1.3). Also paste into the hosted project:
     Authentication > Emails > Confirm signup. The link is verified by web's /auth/confirm. -->
<h2>Confirm your CareerLaunch account</h2>
<p>Click the link below to confirm your email address and finish signing up.</p>
<p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email">Confirm my email</a>
</p>
<p>If you did not sign up for CareerLaunch, you can ignore this email.</p>
