name: Migrate and deploy

# Releases only: migrate the prod DB first (AD-13), then deploy api (Render), then web (Vercel).
# Deploy jobs `needs: migrate`, so a failed migration stops the release. deploy-web waits
# until the Render deploy of the migrated commit is live.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# Releases never overlap, and a running release is never cancelled mid-migration.
concurrency:
  group: migrate-deploy-production
  cancel-in-progress: false

env:
  UV_VERSION: "0.13.1"
  VERCEL_CLI_VERSION: "65.12.1"

jobs:
  migrate:
    name: alembic upgrade head
    # Full releases only (no prereleases), or a manual run from main.
    if: >-
      (github.event_name == 'release' && !github.event.release.prerelease) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    environment: production
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      ENVIRONMENT: prod
      # Supavisor SESSION pooler URL (port 5432).
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Check secret
        run: |
          if [ -z "$MIGRATION_DATABASE_URL" ]; then
            echo "::error::MIGRATION_DATABASE_URL secret is not set"; exit 1
          fi

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Migrate
        run: uv run --no-dev alembic upgrade head

      - name: Exposed-schema check (AD-1) on prod
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: uv run --no-dev python scripts/check_exposed_schema.py

      - name: Ensure the private Storage bucket (idempotent, never public)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STORAGE_BUCKET: ${{ vars.STORAGE_BUCKET || 'private' }}
        run: |
          for k in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!k}" ]; then echo "::error::$k secret is not set"; exit 1; fi
          done
          uv run --no-dev python scripts/ensure_bucket.py

  deploy-api:
    name: Deploy api (Render deploy hook)
    needs: migrate
    environment: production
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
      - name: Check secrets
        run: |
          for k in RENDER_DEPLOY_HOOK_URL RENDER_API_KEY RENDER_SERVICE_ID; do
            if [ -z "${!k}" ]; then echo "::error::$k secret is not set"; exit 1; fi
          done

      - name: Trigger Render deploy of the migrated commit
        id: hook
        run: |
          # The hook URL already carries ?key=...; deploy exactly the commit we migrated.
          case "$RENDER_DEPLOY_HOOK_URL" in *\?*) sep='&' ;; *) sep='?' ;; esac
          body="$(curl --fail --silent --show-error -X POST "${RENDER_DEPLOY_HOOK_URL}${sep}ref=${GITHUB_SHA}")"
          deploy_id="$(printf '%s' "$body" | jq -r '.deploy.id // .id // empty')"
          if [ -z "$deploy_id" ]; then
            echo "::error::Render deploy hook returned no deploy id"; exit 1
          fi
          echo "Render deploy: $deploy_id"
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"

      - name: Wait until the Render deploy is live
        env:
          DEPLOY_ID: ${{ steps.hook.outputs.deploy_id }}
        run: |
          deadline=$(( $(date +%s) + 900 ))  # ~15 minutes
          while :; do
            status="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $RENDER_API_KEY" -H "Accept: application/json" \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}" \
              | jq -r '.status')"
            echo "Render deploy $DEPLOY_ID: $status"
            case "$status" in
              live) exit 0 ;;
              *failed|canceled|deactivated) echo "::error::Render deploy ended as $status"; exit 1 ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out waiting for Render deploy $DEPLOY_ID"; exit 1
            fi
            sleep 15
          done

  deploy-web:
    name: Deploy web (Vercel)
    needs: [migrate, deploy-api]
    environment: production
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Check secrets
        run: |
          for k in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!k}" ]; then echo "::error::$k secret is not set"; exit 1; fi
          done

      - name: Deploy
        run: npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy --prod --yes --token="$VERCEL_TOKEN"
