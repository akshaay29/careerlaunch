name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.1"

jobs:
  api:
    name: api (pytest, import-linter, exposed-schema check)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres  # ggignore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ENVIRONMENT: ci
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Create Supabase roles (plain Postgres only)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/supabase_roles.sql

      - name: Migrate
        run: uv run alembic upgrade head

      - name: pytest
        run: uv run pytest

      - name: import-linter (layers, module order, vendor isolation)
        run: uv run lint-imports

      - name: Exposed-schema check (AD-1)
        run: uv run python scripts/check_exposed_schema.py

  web:
    name: web (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  api-client:
    name: OpenAPI client is up to date (AD-14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: |
          (cd api && uv sync --frozen)
          (cd web && npm ci)

      - name: Regenerate client
        working-directory: web
        run: npm run gen:api

      - name: Fail if the generated client changed
        run: |
          git diff --exit-code web/openapi.json web/src/api
          untracked="$(git status --porcelain --untracked-files=all -- web/openapi.json web/src/api)"
          if [ -n "$untracked" ]; then
            echo "Generated client is out of date. Run 'npm run gen:api' in web/ and commit:"
            echo "$untracked"
            exit 1
          fi
